# iPhone companion app. Generate the Xcode project with:  cd phone && xcodegen
name: BackseatDriver
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  BackseatDriver:
    type: application
    platform: iOS
    sources: [BackseatDriver]
    info:
      path: BackseatDriver/Info.plist
      properties:
        CFBundleDisplayName: Backseat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, bluetooth-central]
        NSLocationWhenInUseUsageDescription: "Backseat Driver sends the name of the road you're on to the headrest display."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Keeps the headrest display updated with the current road while Waze or another app is in front, or the phone is locked."
        NSBluetoothAlwaysUsageDescription: "Connects to the Backseat Driver headrest display."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.backseatdriver.companion
        DEVELOPMENT_TEAM: ""  # your Apple team ID
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
